<style>
/* 好好運動：好好呼吸的姊妹站。同一套顏色、字體和元件；單欄 480px，手機優先。

:root {
  --fs: 1;
  --bg-page: #ffffff;
  --bg-screen: #eef4f5;
  --surface-card: #ffffff;
  --surface-soft: #f4f9fa;
  --fill-icon: #e3f0f3;
  --fill-hover: #e2eff2;
  --ink: #15303a;
  --brand: #2f6475;
  --accent: #1f6f86;
  --text-2: #4a6872;
  --line: #d9e8ec;
  --line-inner: #e6f0f3;
  --line-strong: #cfe2e8;
  --track: #c3dbe2;
  --fade-0: rgba(238, 244, 245, 0);
  --breath: #5aaac0;
  --knob: #ffffff;
  --video-bg: #061015;
  --video-ink: #d6e8ee;
  --scrim: rgba(6, 16, 21, .55);

  --font-sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
:root[data-theme="dark"] {
  --bg-page: #0d1b22; --bg-screen: #0d1b22; --surface-card: #132a33; --surface-soft: #132a33;
  --fill-icon: #173039; --fill-hover: #16303a; --ink: #e6f1f4; --brand: #8fc3d3; --accent: #7cc4da;
  --text-2: #a3bfc8; --line: #1f3943; --line-inner: #1c3640; --line-strong: #23404b; --track: #2a4a56;
  --fade-0: rgba(13, 27, 34, 0);
  --shadow-menu: 0 8px 24px rgba(0, 0, 0, .4);
  color-scheme: dark;
}

html { height: 100%; }
body {
  margin: 0; min-height: 100%; display: flex; flex-direction: column;
  background: var(--bg-page); color: var(--ink);
  font-family: var(--font-sans); font-size: calc(15px * var(--fs)); line-height: 1.7;

}

a { color: var(--accent); text-underline-offset: 3px; }

  padding-right: max(24px, env(safe-area-inset-right, 0px));
}
.screen.home {
  padding-top: calc(56px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}
.screen.task { padding-top: calc(44px + env(safe-area-inset-top, 0px)); }

/* 字 */
.wordmark { margin: 8px 8px 20px; font-size: calc(34px * var(--fs)); font-weight: 500; letter-spacing: .3em; text-indent: .3em; text-align: center; color: var(--brand); line-height: 1.4; }

.desc.lead { margin: 0 4px 28px; }
.desc { margin: 0; font-size: calc(14px * var(--fs)); line-height: 1.7; color: var(--text-2); }

.cap.err { color: var(--ink); font-weight: 500; }

.eyebrow { font-size: calc(13px * var(--fs)); line-height: 1.4; color: var(--text-2); }

.label { font-size: calc(13px * var(--fs)); font-weight: 500; color: var(--brand); }

}

.btn[disabled] { opacity: .4; cursor: default; }
.btn svg { flex: none; }
.text-btn { align-self: center; min-height: 44px; padding: 0 12px; border: none; background: none; font: inherit; font-size: calc(14px * var(--fs)); color: var(--brand); cursor: pointer; }
.back { align-self: flex-start; border: none; background: none; font: inherit; font-size: calc(15px * var(--fs)); color: var(--brand); padding: 8px 0; min-height: 44px; cursor: pointer; }
.pill {
  align-self: center; display: flex; align-items: center; gap: 8px;
  min-height: 44px; padding: 0 16px; box-sizing: border-box;
  border: 1px solid var(--line-strong); border-radius: 22px; background: var(--surface-card);

.menu { position: absolute; top: calc(68px + env(safe-area-inset-top, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); z-index: 4; }

.menu-pop { position: absolute; top: 48px; right: 0; min-width: 220px; padding: 6px 0; border-radius: 14px; border: 1px solid var(--line); background: var(--bg-page); box-shadow: var(--shadow-menu); display: flex; flex-direction: column; }
.menu-item { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px; padding: 0 14px; box-sizing: border-box; border: none; background: none; font: inherit; font-size: calc(14px * var(--fs)); color: var(--ink); text-decoration: none; cursor: pointer; text-align: left; }

.menu-opt { min-height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-card); color: var(--ink); font: inherit; font-size: calc(13px * var(--fs)); cursor: pointer; }

.thumb { flex: none; width: 96px; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; background: var(--fill-icon); color: var(--accent); display: flex; align-items: center; justify-content: center; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb.lg { width: 112px; border-radius: 12px; }

/* 每週目標圈 */
.week { margin-top: 28px; padding: 0 8px; display: flex; align-items: center; gap: 20px; }

.ring-num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }

.sum-row { display: flex; justify-content: space-between; gap: 12px; font-size: calc(14px * var(--fs)); line-height: 1.5; color: var(--text-2); }
.sum-row span:first-child { min-width: 0; overflow-wrap: anywhere; }
.sum-row span:last-child { flex: none; white-space: nowrap; }

/* 影片清單 */
.list { display: flex; flex-direction: column; margin-bottom: 28px; }
.vlist { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.vrow {

  font: inherit; color: var(--ink); text-align: left; cursor: pointer;
}
.vrow:hover { background: var(--surface-soft); }
.vtext { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
.vname { font-size: calc(22px * var(--fs)); font-weight: 300; letter-spacing: .04em; line-height: 1.35; overflow-wrap: anywhere; }
.vmeta { font-size: calc(13px * var(--fs)); line-height: 1.5; color: var(--text-2); }
.foot { text-align: center; margin-top: 14px; }

/* 表單與設定 */
.sections { display: flex; flex-direction: column; gap: 28px; }
.sec { display: flex; flex-direction: column; }
.field {

  border: 1px solid var(--line); border-radius: 14px; background: var(--surface-card);
  font: inherit; font-size: max(16px, calc(15px * var(--fs))); color: var(--ink);
}
.field::placeholder { color: var(--text-2); opacity: .8; }

.actions { display: flex; flex-direction: column; gap: 10px; margin-top: auto; padding-bottom: calc(36px + env(safe-area-inset-bottom, 0px)); }

/* 完成 */
.done-center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; text-align: center; padding: 12px 0 28px; }
.hero { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.done-label { font-size: calc(13px * var(--fs)); letter-spacing: .3em; text-indent: .3em; color: var(--brand); }
.done-val { font: 300 56px/1 var(--font-mono); }
.soft.wide { align-self: stretch; text-align: left; }
.dots { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--line); padding-top: 12px; }
.dot-col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.dot-l { font-size: calc(12px * var(--fs)); line-height: 1.6; color: var(--text-2); }
.dot-l.today { color: var(--ink); font-weight: 500; }
.dot { width: 10px; height: 10px; box-sizing: border-box; border-radius: 50%; border: 2px solid var(--line-strong); }
.dot.on { background: var(--ink); border-color: var(--ink); }

/* 底部面板 */
.scrim { position: fixed; inset: 0; z-index: 5; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 480px; max-height: 92%; overflow-y: auto; box-sizing: border-box;
  background: var(--bg-page); border-radius: 24px 24px 0 0;
  padding-top: 28px; padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 18px;
}
.sheet h3 { margin: 0; font-size: calc(20px * var(--fs)); font-weight: 700; line-height: 1.4; overflow-wrap: anywhere; }
.sheet .url-cap { margin: -6px 0 0; overflow-wrap: anywhere; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.confirm { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 16px; font-size: calc(14px * var(--fs)); }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.steps { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; font-size: calc(15px * var(--fs)); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; }
}
</style>

          '</div></div></div></div>' +
        '<div class="sec"><div class="label-row"><span class="label" id="days-l">提醒日</span><span class="label-val">' + (r.days.length === 7 ? '每天' : '每週 ' + r.days.length + ' 天') + '</span></div>' +
          '<div class="opts days" role="group" aria-labelledby="days-l">' + DAY_LABELS.map(function (l, i) {
            return '<button class="opt" data-act="day" data-v="' + (i + 1) + '" aria-pressed="' + (r.days.indexOf(i + 1) >= 0) + '" aria-label="星期' + l + '">' + l + '</button>';
          }).join('') + '</div>' +
          (r.days.length ? '' : '<p class="cap">至少選一天才會提醒。</p>') + '</div>' +
        '<div class="sec"><div class="label-row"><span class="label">時間</span></div>' +
          '<div class="card"><div class="stepper"><span>提醒時間</span><div class="step-ctl">' +
            '<button class="step-btn" data-act="time-dec" aria-label="提早 15 分鐘">−</button><span class="step-val">' + r.time + '</span><button class="step-btn" data-act="time-inc" aria-label="延後 15 分鐘">+</button>' +
          '</div></div></div><p class="cap">每按一下調 15 分鐘。</p></div>' +
        '<div class="sec"><div class="label-row"><span class="label" id="order-l">影片順序</span></div>' +
          '<div class="opts two" role="group" aria-labelledby="order-l">' +
            '<button class="opt" data-act="order" data-v="rotate" aria-pressed="' + (r.order === 'rotate') + '">照順序輪流</button>' +
            '<button class="opt" data-act="order" data-v="random" aria-pressed="' + (r.order === 'random') + '">隨機挑一支</button>' +
          '</div><p class="cap">' + (r.order === 'rotate' ? '依「我的影片」的順序，一次輪一支。' : '每天隨機挑一支，同一天不會變。') + '</p></div>' +
        calHTML(dirty) +
      '</div>' +
      '<div class="bottom">' + (state.remSaved && !dirty ? '<p class="cap ok" role="status">已儲存。</p>' : '') +
        '<button class="btn btn-primary" data-act="save-rem"' + (dirty ? '' : ' disabled') + '>儲存</button></div>' +
      '</main>';
  }
  function calHTML(dirty) {
    var s = data.settings, body;
    if (dirty || !s.days.length) {
      body = '<p class="desc">' + (dirty ? '先按「儲存」，再加到日曆。' : '先選至少一天。') + '</p>';
    } else {
      var c = s.cal, stale = c && (c.time !== s.time || c.days.join() !== s.days.join());
      body = '<p class="desc">加到日曆後，時間到手機會跳通知，點通知裡的連結就回到這裡。</p>' +
        '<a class="btn btn-secondary btn-md" href="' + esc(gcalUrl(s)) + '" target="_blank" rel="noopener" data-act="gcal">' + uiIcon('cal') + '<span>加到 Google 日曆</span></a>' +
        '<p class="cap">會打開 Google 日曆，確認後按「儲存」。通知照日曆的預設時間。</p>' +
        '<button class="btn btn-secondary btn-md" data-act="ics">' + uiIcon('download') + '<span>加到 iPhone 或其他日曆</span></button>' +
        '<p class="cap">下載一個日曆檔，打開後選「加入」，時間一到就通知。</p>' +
        (c ? '<p class="cap ' + (stale ? 'err' : '') + '">' + (stale
          ? '日曆裡可能還是舊的時間（' + daysText(c.days) + ' ' + c.time + '）。請再加一次，並刪掉日曆裡舊的那筆。'
          : '已經加過：' + daysText(c.days) + ' ' + c.time + '。') + '</p>' : '');
    }
    return '<div class="sec"><div class="label-row"><span class="label">加到日曆</span></div><div class="card cal">' + body + '</div></div>';
  }

  // ---------- 繪製 ----------
  function mount() {
    document.body.classList.toggle('task', state.screen !== 'home');
    var html;
    if (state.screen === 'play' && state.play) html = playHTML();
    else if (state.screen === 'done') html = doneHTML();
    else if (state.screen === 'form' && state.form) html = formHTML();
    else if (state.screen === 'reminders' && state.rem) html = remHTML();
    else { state.screen = 'home'; html = homeHTML(); }
    $app.innerHTML = html;
    if (state.screen === 'play') afterPlayMount();
    if (state.screen === 'form') afterFormMount();
  }
  // 資料變了（同步、換天）：有影片或輸入框的畫面不整個重畫
  function refresh() {
    if (state.screen === 'play') return;
    if (state.screen === 'form') return;
    mount();
  }
  function go(screen, notice) {
    teardown();
    state.screen = screen;
    state.notice = notice || null;
    state.menu = false; state.menuSub = null;
    mount();
    try { window.scrollTo(0, 0); } catch (e) {}
  }
  function teardown() {
    clearInterval(poll); poll = null;
    if (player) { try { player.destroy(); } catch (e) {} player = null; }
    if (fplayer) { try { fplayer.destroy(); } catch (e) {} fplayer = null; }
    try { if (wake) wake.release(); } catch (e) {}
    wake = null;
    if (state.screen === 'play' && syncAgain) setTimeout(function () { syncAgain = false; syncNow(); }, 0);
  }

  // ---------- YouTube 播放器 ----------
  var ytP = null, player = null, fplayer = null, poll = null, wake = null;
  function loadYT() {
    if (ytP) return ytP;
    ytP = new Promise(function (res, rej) {
      if (window.YT && YT.Player) { res(); return; }
      var prev = window.onYouTubeIframeAPIReady;
      window.onYouTubeIframeAPIReady = function () { if (prev) try { prev(); } catch (e) {} res(); };
      var sc = document.createElement('script');
      sc.src = 'https://www.youtube.com/iframe_api';
      sc.async = true;
      sc.onerror = function () { ytP = null; rej(); };
      document.head.appendChild(sc);
      setTimeout(function () { if (!(window.YT && YT.Player)) { ytP = null; rej(); } }, 15000);
    });
    return ytP;
  }
  function requestWake() {
    try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then(function (l) { wake = l; }, function () {}); } catch (e) {}
  }
  function startVideo(id) {
    var v = getVideo(id);
    if (!v) return;
    state.sheet = null; state.confirmDelete = false; state.panel = null;
    state.play = { videoId: v.id, title: v.title, minutes: v.minutes, url: v.url, yt: v.yt, type: v.type, startedAt: Date.now(), st: 'loading' };
    // 不是 YouTube 的連結：讓連結先在新分頁打開，再換畫面
    setTimeout(function () { go('play'); }, 0);
  }
  function afterPlayMount() {
    var p = state.play;
    poll = setInterval(updatePlay, 1000);
    requestWake();
    updatePlay();
    if (!p.yt) return;
    loadYT().then(function () {
      if (state.play !== p || !$('player')) return;
      player = new YT.Player('player', {
        host: YT_HOST, videoId: p.yt, width: '100%', height: '100%',
        playerVars: { playsinline: 1, rel: 0, modestbranding: 1 },
        events: {
          onReady: function (e) { if (state.play !== p) return; p.st = 'ready'; vmsg(''); try { e.target.playVideo(); } catch (err) {} updatePlay(); },
          onStateChange: function (e) {
            if (state.play !== p) return;
            if (e.data === 0) { finish(true); return; }
            if (e.data === 1) p.st = 'playing'; else if (e.data === 2) p.st = 'paused';
            updatePlay();
          },
          onError: function () { if (state.play !== p) return; p.st = 'error'; vmsg('error'); updatePlay(); }
        }
      });
    }, function () { if (state.play !== p) return; p.st = 'error'; vmsg('error'); updatePlay(); });
  }
  function vmsg(kind) {
    var el = $('vmsg'), p = state.play;
    if (!el || !p) return;
    if (!kind) { el.hidden = true; return; }
    el.hidden = false;
    el.innerHTML = '<span>影片在這裡播不了，可能是網路不穩，或這支影片不允許在其他網站播放。</span>' +
      '<a href="https://www.youtube.com/watch?v=' + p.yt + '" target="_blank" rel="noopener">到 YouTube 看</a>';
  }
  function updatePlay() {
    var p = state.play;
    if (!p) return;
    var cur = 0, dur = 0;
    if (p.yt) {
      if (player && player.getDuration) { try { dur = player.getDuration() || 0; cur = player.getCurrentTime() || 0; } catch (e) {} }
      if (!dur) dur = p.minutes * 60;
    } else {
      dur = p.minutes * 60; cur = (Date.now() - p.startedAt) / 1000;
    }
    var rem = Math.max(0, dur - cur);
    var r = $('remain'); if (r) r.textContent = '剩 ' + mmss(rem);
    var big = $('big'); if (big) big.textContent = mmss(rem);
    var b = $('bar'); if (b) b.style.width = Math.min(100, cur / dur * 100) + '%';
    var ph = $('phase');
    if (ph) ph.textContent = p.yt
      ? ({ loading: '正在載入影片', ready: '按下影片開始', playing: '跟著影片做', paused: '暫停中', error: '到 YouTube 看影片' }[p.st] || '跟著影片做')
      : (rem <= 0 ? '時間到' : '跟著影片做');
  }
  function finish(auto) {
    var p = state.play;
    if (!p || p.finishing) return;
    p.finishing = true;
    var now = new Date();
    data.log[rid()] = { date: ymd(now), at: now.getTime(), videoId: p.videoId, title: p.title, minutes: p.minutes };
    changed();
    state.lastDone = p; state.play = null; state.skip = 0;
    go('done', auto ? { text: '影片播完了，已經記錄。' } : null);
  }

  // ---------- 加入／編輯影片 ----------
  var urlTimer = 0;
  function openForm(id, share) {
    var v = id ? getVideo(id) : null;
    state.form = v
      ? { id: v.id, url: v.url, title: v.title, minutes: v.minutes, type: v.type, inRotation: v.inRotation, order: v.order, createdAt: v.createdAt, titleTouched: true, minTouched: true, previewYt: '' }
      : { id: null, url: share ? share.url : '', title: share && share.title ? share.title.slice(0, 80) : '', minutes: 15, type: 'stretch', inRotation: true, order: 0, createdAt: 0, titleTouched: false, minTouched: false, previewYt: '' };
    state.sheet = null; state.confirmDelete = false; state.panel = null;
    go('form');
  }
  function afterFormMount() {
    var st = urlStatus(state.form.url);
    showPreview(st.ok ? st.yt : '');
  }
  function setMsg(id, text, tone) { var el = $(id); if (el) { el.textContent = text; el.className = 'cap ' + (tone || ''); } }
  function renderFormControls() { var el = $('form-controls'); if (el && state.form) el.innerHTML = formControlsHTML(); }
  function showPreview(yt) {
    var f = state.form, box = $('preview');
    if (!f || !box || yt === f.previewYt) return;
    f.previewYt = yt;
    if (fplayer) { try { fplayer.destroy(); } catch (e) {} fplayer = null; }
    if (!yt) { box.hidden = true; box.innerHTML = ''; return; }
    box.hidden = false;
    box.innerHTML = '<img alt="" onerror="this.remove()" src="https://i.ytimg.com/vi/' + yt + '/hqdefault.jpg"><div id="fplayer"></div>';
    loadYT().then(function () {
      if (state.form !== f || f.previewYt !== yt || !$('fplayer')) return;
      fplayer = new YT.Player('fplayer', {
        host: YT_HOST, videoId: yt, width: '100%', height: '100%',
        playerVars: { playsinline: 1, rel: 0, modestbranding: 1 },
        events: {
          onReady: function (e) { readMeta(e.target, f, yt, 0); },
          onError: function () { if (state.form === f && f.previewYt === yt) setMsg('url-msg', '這支影片可能不允許在其他網站播放；加入後會改成到 YouTube 看。', ''); }
        }
      });
    }).catch(function () {});
  }
  // 從播放器讀出影片的名字和長度，自動填進還沒自己改過的欄位
  function readMeta(p, f, yt, tries) {
    if (state.form !== f || f.previewYt !== yt) return;
    var dur = 0, title = '';
    try { dur = p.getDuration() || 0; } catch (e) {}
    try { var vd = p.getVideoData && p.getVideoData(); title = vd && typeof vd.title === 'string' ? vd.title.trim() : ''; } catch (e) {}
    var filled = [];
    if (title && !f.titleTouched && f.titleFor !== yt) {
      f.title = title.slice(0, 80); f.titleFor = yt;
      var ti = $('f-title'); if (ti) ti.value = f.title;
      filled.push('名字');
    }
    if (dur && !f.minTouched && f.minFor !== yt) {
      f.minutes = Math.min(300, Math.max(1, Math.round(dur / 60))); f.minFor = yt;
      renderFormControls();
      filled.push('長度');
    }
    if (filled.length) setMsg('url-msg', '找到影片，已經填好' + filled.join('和') + '。', 'ok');
    if ((!dur || !title) && tries < 5) setTimeout(function () { readMeta(p, f, yt, tries + 1); }, 800);
  }
  function saveVideo() {
    var f = state.form, st = urlStatus(f.url);
    if (!st.ok) { setMsg('url-msg', st.empty ? '請先貼上影片網址。' : st.msg, 'err'); var u = $('f-url'); if (u) u.focus(); return; }
    var title = f.title.trim().slice(0, 80);
    if (!title) { setMsg('title-msg', '請取個名字，例如「晨間伸展」。', 'err'); var t = $('f-title'); if (t) t.focus(); return; }
    var isNew = !f.id, id = f.id || rid(), now = Date.now();
    var order = isNew ? videoList().reduce(function (m, v) { return Math.max(m, v.order); }, 0) + 1 : f.order;
    data.videos[id] = normVideo({ title: title, url: st.url, yt: st.yt || '', type: f.type, minutes: f.minutes, inRotation: f.inRotation, order: order, createdAt: f.createdAt || now, at: now });
    changed();
    state.form = null;
    go('home', { text: (isNew ? '已加入「' : '已儲存「') + title + '」。' });
  }

  // ---------- 提醒設定 ----------
  function openRem() {
    var s = data.settings;
    state.rem = { goal: s.goal, days: s.days.slice(), time: s.time, order: s.order };
    state.remSaved = false;
    go('reminders');
  }
  function shiftTime(t, dir) {
    var hm = t.split(':').map(Number), m = hm[0] * 60 + hm[1];
    m = dir > 0 ? Math.floor(m / 15) * 15 + 15 : Math.ceil(m / 15) * 15 - 15;
    m = (m + 1440) % 1440;
    return pad(Math.floor(m / 60)) + ':' + pad(m % 60);
  }

  // ---------- 外觀 ----------
  function applyUi() {
    if (data.ui.theme === 'dark') document.documentElement.dataset.theme = 'dark';
    else document.documentElement.removeAttribute('data-theme');
    document.documentElement.style.setProperty('--fs', [1, 1.15, 1.3][data.ui.fsz] || 1);
  }

  // ---------- 事件 ----------
  document.addEventListener('click', function (e) {
    if (state.menu && !e.target.closest('#menu')) { state.menu = false; state.menuSub = null; mount(); if (!e.target.closest('[data-act]')) return; }
    var el = e.target.closest('[data-act]');
    if (!el || !$app.contains(el) || el.disabled) return;
    var act = el.getAttribute('data-act'), id = el.getAttribute('data-id'), val = el.getAttribute('data-v');
    if (act === 'close' && e.target.closest('[data-stop]')) return;
    var f = state.form, r = state.rem;
    switch (act) {
      case 'start': if (el.tagName !== 'A') e.preventDefault(); startVideo(id); break;
      case 'menu': state.menu = !state.menu; state.menuSub = null; mount(); break;
      case 'menu-sub': state.menuSub = state.menuSub === val ? null : val; mount(); break;
      case 'panel': state.menu = false; state.panel = val; if (val === 'sync') loadGis().catch(function () {}); mount(); break;
      case 'theme': data.ui.theme = data.ui.theme === 'dark' ? 'light' : 'dark'; persist(); applyUi(); mount(); break;
      case 'fsz': data.ui.fsz = Number(val) || 0; persist(); applyUi(); mount(); break;
      case 'install': if (installEvt) { installEvt.prompt(); installEvt = null; } state.panel = null; mount(); break;
      case 'sync-go': tapSync(); break;
      case 'sync-out': signOut(); break;
      case 'reminders': openRem(); break;
      case 'add': openForm(null); break;
      case 'edit': openForm(id); break;
      case 'open': state.sheet = id; state.confirmDelete = false; mount(); break;
      case 'close': case 'close-btn': state.sheet = null; state.panel = null; state.confirmDelete = false; mount(); break;
      case 'ask-delete': state.confirmDelete = true; mount(); break;
      case 'cancel-delete': state.confirmDelete = false; mount(); break;
      case 'delete':
        if (data.videos[id]) { data.videos[id] = Object.assign({}, data.videos[id], { del: true, at: Date.now() }); changed(); }
        state.sheet = null; state.confirmDelete = false; state.notice = { text: '已刪除。' }; mount();
        break;
      case 'skip': state.skip++; mount(); break;
      case 'home': state.play = null; go('home'); break;
      case 'stop': state.play = null; go('home'); break;
      case 'finish': finish(false); break;
      case 'min-dec': f.minutes = f.minutes > 10 ? Math.ceil(f.minutes / 5) * 5 - 5 : Math.max(1, f.minutes - 1); f.minTouched = true; renderFormControls(); break;
      case 'min-inc': f.minutes = f.minutes >= 10 ? Math.min(300, Math.floor(f.minutes / 5) * 5 + 5) : f.minutes + 1; f.minTouched = true; renderFormControls(); break;
      case 'type': f.type = TYPE_KEYS.indexOf(val) >= 0 ? val : 'other'; renderFormControls(); break;
      case 'rot': f.inRotation = !f.inRotation; renderFormControls(); break;
      case 'save-video': saveVideo(); break;
      case 'goal-dec': r.goal = Math.max(1, r.goal - 1); state.remSaved = false; mount(); break;
      case 'goal-inc': r.goal = Math.min(7, r.goal + 1); state.remSaved = false; mount(); break;
      case 'day':
        var n = Number(val), i = r.days.indexOf(n);
        if (i >= 0) r.days.splice(i, 1); else r.days.push(n);
        r.days.sort(function (a, b) { return a - b; });
        state.remSaved = false; mount(); break;
      case 'time-dec': r.time = shiftTime(r.time, -1); state.remSaved = false; mount(); break;
      case 'time-inc': r.time = shiftTime(r.time, 1); state.remSaved = false; mount(); break;
      case 'order': r.order = val === 'random' ? 'random' : 'rotate'; state.remSaved = false; mount(); break;
      case 'save-rem':
        Object.assign(data.settings, { goal: r.goal, days: r.days.slice(), time: r.time, order: r.order, at: Date.now() });
        changed();
        state.remSaved = true; state.skip = 0; mount();
        break;
      case 'gcal': markCal(); break;
      case 'ics': downloadIcs(); break;
    }
  });
  document.addEventListener('input', function (e) {
    var t = e.target, f = state.form;
    if (!f) return;
    if (t.id === 'f-url') {
      f.url = t.value;
      var st = urlStatus(t.value);
      setMsg('url-msg', st.msg, st.tone);
      clearTimeout(urlTimer);
      urlTimer = setTimeout(function () { var s2 = urlStatus(f.url); showPreview(s2.ok ? s2.yt : ''); }, 350);
    } else if (t.id === 'f-title') {
      f.title = t.value; f.titleTouched = true;
      setMsg('title-msg', '', '');
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (state.sheet || state.panel || state.menu) { state.sheet = null; state.panel = null; state.menu = false; state.confirmDelete = false; mount(); }
  });
  var lastDay = ymd(new Date());
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;
    if (state.screen === 'play') { requestWake(); updatePlay(); return; }
    if (ymd(new Date()) !== lastDay) { lastDay = ymd(new Date()); state.skip = 0; refresh(); }
    if (sync && tokenOk()) syncNow();
  });

  // ---------- 啟動 ----------
  var share = null;
  try {
    var q = new URLSearchParams(location.search);
    var raw = [q.get('url'), q.get('text')].filter(Boolean).join(' ');
    var m = raw.match(/https?:\/\/\S+/);
    if (m) share = { url: m[0], title: (q.get('title') || '').trim() };
    if (q.has('url') || q.has('text') || q.has('title')) history.replaceState(null, '', location.pathname + location.hash);
  } catch (e) {}
  applyUi();
  persist();
  if (share) openForm(null, share); else mount();
  if (syncOn) {
    try { sync = JSON.parse(localStorage.getItem(LS_SYNC) || 'null'); } catch (e) { sync = null; }
    if (sync) loadGis().catch(function () {});   // 先載入，按「立即同步」時才能馬上跳出 Google 的視窗
    if (tokenOk()) syncNow();
  }
})();
</script>
