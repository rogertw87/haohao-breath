<style>
:root { --h0: #ffffff; --h1: #eef4f5; --h2: #15303a; --h3: #2f6475; --h7: #d9e8ec; --h13: #4a6872; }
:root[data-theme="dark"] { --h0: #0d1b22; --h1: #152a33; --h2: #e6f1f4; --h3: #8fc3d3; --h7: #25404b; --h13: #a3bec7; }
body { margin: 0; background: var(--h0); font-family: 'Noto Sans TC', sans-serif; color: var(--h2); -webkit-font-smoothing: antialiased; }
a { color: var(--h3); text-underline-offset: 3px; }
a:hover { color: var(--h2); }
header { border-bottom: 1px solid var(--h7); }
.bar { max-width: 720px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; min-height: 44px; }
.brand { font-size: 18px; font-weight: 500; letter-spacing: .3em; text-decoration: none; color: var(--h3); }
article { max-width: 720px; margin: 0 auto; padding: 48px 24px 80px; box-sizing: border-box; line-height: 1.9; font-size: 16px; }
h1 { margin: 0 0 28px; font-size: 32px; font-weight: 700; }
p { margin: 0 0 20px; color: var(--h13); text-wrap: pretty; }
.cta {
  margin-top: 36px; display: inline-flex; align-items: center; height: 48px; padding: 0 24px; border-radius: 14px;
  background: var(--h2); color: var(--h0); text-decoration: none; font-size: 15px; font-weight: 500;
}
.cta:hover { color: var(--h0); }
</style>
</head>
<body>
<header>
  <div class="bar"><a class="brand" href="./">好好呼吸</a></div>
</header>
<article>
  <h1>感謝</h1>
  <p>待新增</p>
  <a class="cta" href="./">回到首頁</a>
</article>
</body>
</html>
