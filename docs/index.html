<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>好好呼吸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
<main class="home">
  <div class="home-inner">
    <h1 class="title">好好呼吸</h1>
    <div class="list" id="list"></div>
  </div>
</main>

<!-- 設定頁 -->
<section class="screen" id="setup" hidden>
  <div class="setup-inner">
    <button class="back" data-action="close">← 返回</button>
    <h2 class="ex-name" data-bind="name"></h2>

    <div class="wip" id="wip" hidden>
      <span class="wip-title">設計中</span>
    </div>

    <div class="setup-body" id="setupBody">
      <p class="desc" data-bind="desc"></p>

      <div id="adjust">
        <div class="section-head">
          <span class="section-title" id="rhythmTitle"></span>
          <button class="reset" data-action="reset">恢復預設</button>
        </div>
        <div class="panel rows" id="phaseRows"></div>
        <p class="hint" id="cycleText"></p>
      </div>

      <div class="section-head">
        <span class="section-title">總練習長度</span>
        <span class="minutes-val"><span data-bind="minutes"></span> 分鐘</span>
      </div>
      <div class="panel slider-panel">
        <input type="range" id="minutes" min="1" max="30" step="1">
        <div class="ticks"><span>1</span><span>10</span><span>20</span><span>30</span></div>
      </div>

      <span class="section-title music-title">背景音樂</span>
      <div class="music-grid" id="music"></div>
      <p class="hint music-hint" id="musicHint" hidden>練習開始時播放。</p>

      <div class="start-bar">
        <button class="btn btn-primary" data-action="start">開始 · <span data-bind="minutes"></span> 分鐘</button>
      </div>
    </div>
  </div>
</section>

<!-- 練習畫面 -->
<section class="screen screen-center" id="run" hidden>
  <div class="run-inner">
    <div class="run-head">
      <span class="run-name" data-bind="name"></span>
      <span class="run-left">剩 <span id="totalText">0:00</span></span>
    </div>
    <div class="progress"><div class="progress-fill" id="progress"></div></div>

    <div class="stage">
      <!-- 方塊呼吸 -->
      <div class="anim anim-box" id="animBox" hidden>
        <div class="box-frame"><div class="dot" id="boxDot"></div></div>
      </div>

      <!-- 鼻孔交替呼吸 -->
      <div class="anim anim-n" id="animN" hidden>
        <div class="n-frame"><div class="dot" id="nDot"></div></div>
        <div class="n-labels"><span>左</span><span>右</span></div>
      </div>

      <!-- 呼氣練習：人物動畫 -->
      <svg class="anim" id="animFig" hidden width="300" height="270" viewBox="0 0 400 360">
        <g data-k="body"><path d="M58 380 L60 360 C 66 316, 110 296, 160 290 L240 290 C 290 296, 334 316, 340 360 L342 380 Z" fill="#d3e6ec"></path><path d="M170 292 C 180 306, 220 306, 230 292" fill="none" stroke="#3f8fa6" stroke-width="3" stroke-linecap="round"></path></g>
        <g data-k="head">
          <rect x="176" y="250" width="48" height="46" rx="14" fill="#E9B893"></rect>
          <ellipse cx="108" cy="168" rx="16" ry="24" fill="#EDBE99"></ellipse>
          <ellipse cx="292" cy="168" rx="16" ry="24" fill="#EDBE99"></ellipse>
          <ellipse cx="200" cy="160" rx="92" ry="108" fill="#F3CBA9"></ellipse>
          <path d="M108 150 C 100 70, 160 44, 204 46 C 256 46, 304 76, 292 150 C 284 118, 262 98, 232 92 C 206 104, 160 106, 128 102 C 116 116, 110 132, 108 150 Z" fill="#3B2A22"></path>
          <path d="M150 140 C 160 134, 172 134, 180 138" fill="none" stroke="#3B2A22" stroke-width="3.5" stroke-linecap="round"></path>
          <path d="M220 138 C 228 134, 240 134, 250 140" fill="none" stroke="#3B2A22" stroke-width="3.5" stroke-linecap="round"></path>
          <path d="M150 162 C 158 170, 172 170, 180 162" fill="none" stroke="#3B2A22" stroke-width="3.5" stroke-linecap="round"></path>
          <path d="M220 162 C 228 170, 242 170, 250 162" fill="none" stroke="#3B2A22" stroke-width="3.5" stroke-linecap="round"></path>
          <ellipse cx="148" cy="200" rx="16" ry="9" fill="#EF9F9A" opacity=".45"></ellipse>
          <ellipse cx="252" cy="200" rx="16" ry="9" fill="#EF9F9A" opacity=".45"></ellipse>
          <path d="M200 166 C 198 182, 192 192, 190 200 C 194 206, 206 206, 210 200" fill="none" stroke="#C98E6A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
          <ellipse data-k="nosL" cx="193" cy="203" rx="3.2" ry="2.2" fill="#8A5A40"></ellipse>
          <ellipse data-k="nosR" cx="207" cy="203" rx="3.2" ry="2.2" fill="#8A5A40"></ellipse>
          <ellipse data-k="lips" cx="200" cy="236" rx="24" ry="5" fill="#D9736E"></ellipse>
          <ellipse data-k="hole" cx="200" cy="236" rx="0" ry="0" fill="#5A2626"></ellipse>
        </g>
        <g id="figDots"></g>
        <g id="figPuffs"></g>
      </svg>

      <!-- 其他練習：波形圖 -->
      <div class="anim anim-wave" id="animWave" hidden>
        <div class="wave-box">
          <svg class="wave-svg" width="300" height="160" viewBox="0 0 300 160">
            <line x1="0" y1="80" x2="300" y2="80" stroke="#dceaee" stroke-width="1" stroke-dasharray="3 5"></line>
            <g id="waveG" transform="translate(150 0)"><path id="wavePath" fill="none" stroke="#cfe2e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g>
            <line x1="150" y1="0" x2="150" y2="160" stroke="#dceaee" stroke-width="1"></line>
          </svg>
          <div class="dot" id="waveDot" style="transform:translate(150px,140px)"></div>
        </div>
        <div class="wave-cycle">一輪 <span id="cycleSec"></span></div>
      </div>

      <div class="phase">
        <span class="phase-label" id="phaseLabel"></span>
        <span class="phase-count" id="countText"></span>
      </div>
    </div>

    <button class="btn btn-secondary" data-action="stop">停止</button>
  </div>
</section>

<!-- 完成畫面 -->
<section class="screen screen-center" id="done" hidden>
  <div class="run-inner">
    <div class="done-body">
      <span class="done-tag">完成</span>
      <span class="done-time"><span data-bind="minutes"></span>:00</span>
      <span class="done-name" data-bind="name"></span>
    </div>
    <div class="done-actions">
      <button class="btn btn-primary" data-action="start">再練一次</button>
      <button class="btn btn-secondary" data-action="close">回首頁</button>
    </div>
  </div>
</section>

<script src="app.js?v=3"></script>
</body>
</html>
